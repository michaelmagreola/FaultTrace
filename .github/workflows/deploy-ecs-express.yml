name: Deploy ECS Express

# Skeleton — wire secrets and cluster ARN when AWS workshop resources exist.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-ecs-express.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: faulttrace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY-api:$IMAGE_TAG ./backend
          docker push $REGISTRY/$ECR_REPOSITORY-api:$IMAGE_TAG
          echo "Pushed $REGISTRY/$ECR_REPOSITORY-api:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY-web:$IMAGE_TAG ./frontend
          docker push $REGISTRY/$ECR_REPOSITORY-web:$IMAGE_TAG
          echo "Pushed $REGISTRY/$ECR_REPOSITORY-web:$IMAGE_TAG"

      # Next: update ECS Express service / task definition with new image digests.
      - name: Note
        run: echo "Wire ECS Express service update here once the cluster exists."
