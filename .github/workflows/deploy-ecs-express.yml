name: Deploy to ECS Express Mode

# Same path as RouteIQ: ECR image → Amazon ECS Express Mode (App Runner fallback).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "frontend/**"
      - "backend/**"
      - "package.json"
      - ".github/workflows/deploy-ecs-express.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: faulttrace
  SERVICE_NAME: faulttrace
  CONTAINER_PORT: "8080"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
                 --image-scanning-configuration scanOnPush=true

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build --no-cache -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Ensure ECS Express IAM roles
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          if ! aws iam get-role --role-name ecsTaskExecutionRole >/dev/null 2>&1; then
            aws iam create-role --role-name ecsTaskExecutionRole \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            aws iam attach-role-policy --role-name ecsTaskExecutionRole \
              --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
          fi

          if ! aws iam get-role --role-name ecsInfrastructureRoleForExpressServices >/dev/null 2>&1; then
            aws iam create-role --role-name ecsInfrastructureRoleForExpressServices \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Sid":"AllowAccessInfrastructureForECSExpressServices","Effect":"Allow","Principal":{"Service":"ecs.amazonaws.com"},"Action":"sts:AssumeRole"}]}'
            aws iam attach-role-policy --role-name ecsInfrastructureRoleForExpressServices \
              --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
          fi

          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          sleep 10

      - name: Create or update Express Mode service
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -e
          if [ -z "${SESSION_SECRET}" ] || [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "SESSION_SECRET GitHub secret must be set to a random value (>= 32 chars)."
            exit 1
          fi
          case "$SESSION_SECRET" in
            faulttrace-ecs-express-session-secret|dev-only-faulttrace-session-secret-change-me|replace-with-a-long-random-secret)
              echo "SESSION_SECRET must not be a documented placeholder."
              exit 1
              ;;
          esac

          EXEC_ARN="arn:aws:iam::${ACCOUNT_ID}:role/ecsTaskExecutionRole"
          INFRA_ARN="arn:aws:iam::${ACCOUNT_ID}:role/ecsInfrastructureRoleForExpressServices"

          # Keep the signing key in Secrets Manager (not plaintext task-def environment).
          SECRET_NAME="faulttrace/session-secret"
          if ! SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text 2>/dev/null); then
            SECRET_ARN=$(aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --description "FaultTrace HMAC session signing secret" \
              --secret-string "$SESSION_SECRET" \
              --query ARN --output text)
          else
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "$SESSION_SECRET" >/dev/null
            SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_NAME" --query ARN --output text)
          fi

          cat > /tmp/ft-sm-policy.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Action": ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret"],
              "Resource": "${SECRET_ARN}"
            }]
          }
          EOF
          aws iam put-role-policy \
            --role-name ecsTaskExecutionRole \
            --policy-name FaultTraceSessionSecretAccess \
            --policy-document file:///tmp/ft-sm-policy.json

          PRIMARY=$(jq -cn \
            --arg img "$IMAGE_URI" \
            --argjson port "$CONTAINER_PORT" \
            --arg secretArn "$SECRET_ARN" \
            '{image:$img, containerPort:$port,
              environment:[
                {name:"AUTH_MODE",value:"dev"},
                {name:"AI_MODE",value:"local"}
              ],
              secrets:[
                {name:"SESSION_SECRET", valueFrom:$secretArn}
              ]
            }')

          if aws ecs describe-express-gateway-service \
               --service-arn "arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}" \
               >/tmp/svc.json 2>/dev/null; then
            echo "Updating existing service..."
            aws ecs update-express-gateway-service \
              --service-arn "arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}" \
              --primary-container "$PRIMARY" \
              --health-check-path "/health" \
              --monitor-resources
          else
            echo "Creating Express Mode service..."
            aws ecs create-express-gateway-service \
              --service-name "$SERVICE_NAME" \
              --primary-container "$PRIMARY" \
              --execution-role-arn "$EXEC_ARN" \
              --infrastructure-role-arn "$INFRA_ARN" \
              --cpu 256 \
              --memory 512 \
              --health-check-path "/health" \
              --scaling-target "minTaskCount=1,maxTaskCount=2" \
              --monitor-mode TEXT-ONLY \
              --monitor-resources
          fi

      - name: Print public URL
        run: |
          set -e
          aws ecs describe-express-gateway-service \
            --service-arn "arn:aws:ecs:${AWS_REGION}:${ACCOUNT_ID}:service/default/${SERVICE_NAME}" \
            --output json | tee /tmp/express.json
          ENDPOINT=$(python3 -c "import json; d=json.load(open('/tmp/express.json')); cfgs=d.get('service',{}).get('activeConfigurations') or []; print(cfgs[0]['ingressPaths'][0]['endpoint'] if cfgs else '')")
          if [ -n "$ENDPOINT" ]; then
            echo "LIVE_URL=https://${ENDPOINT}/" >> "$GITHUB_STEP_SUMMARY"
            echo "https://${ENDPOINT}/"
          else
            echo "Service created; endpoint may appear after ACTIVE. Check ECS console."
          fi
